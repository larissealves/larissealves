name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: larissealves
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%239333ea&color_dots=%23f3e8ff%2C%23e9d5ff%2C%23c084fc%2C%239333ea%2C%236b21a8&speed=0.3
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23c084fc&color_dots=%233b0764%2C%236b21a8%2C%239333ea%2C%23c084fc%2C%23e9d5ff&speed=0.3

      - name: Push generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
